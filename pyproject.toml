[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-harness-tool"
version = "0.1.0"
description = "MCP service exposing calibrated decision capabilities backed by the jev decision model API"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
]

[project.scripts]
jev-harness-tool = "jev_harness_tool.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real: tests that call the real jev API and spend credits (deselect with -m 'not real')",
]
